<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#050518; font-family:'Rubik',sans-serif; color:#fff; }

/* CANVAS */
#game {
  display:block; width:100%; height:100%;
  position:fixed; inset:0; z-index:0; pointer-events:none;
}

/* HUD */
#hud {
  position:fixed; top:0; left:0; right:0; padding:14px 18px;
  pointer-events:none; z-index:10;
  display:flex; flex-direction:column; gap:4px;
}
#score {
  font-family:'Bungee',cursive; font-size:26px; letter-spacing:2px;
  color:#fff; text-shadow:0 0 12px rgba(255,204,0,0.8), 3px 3px 0 #000;
}
#coins {
  font-family:'Bungee',cursive; font-size:20px;
  color:#ffd700; text-shadow:0 0 10px rgba(255,215,0,0.6), 2px 2px 0 #000;
}
#players { margin-top:6px; font-size:12px; color:#0ff; font-family:'Rubik',sans-serif; }

/* BUTTONS oben (Mod + Pause) */
.iconBtn {
  position:fixed; top:14px; width:52px; height:52px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  cursor:pointer; z-index:100; user-select:none;
  font-family:'Bungee',cursive; font-size:22px;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
  backdrop-filter:blur(8px);
}
.iconBtn.show { display:flex; }
.iconBtn:active { transform:scale(0.92); }

#modBtn {
  right:14px;
  background:linear-gradient(135deg, #1a1a1a, #000);
  color:#ffcc00; border:2px solid #ffcc00;
  box-shadow:0 0 20px rgba(255,204,0,0.5), inset 0 0 10px rgba(255,204,0,0.2);
}
#modBtn:hover { box-shadow:0 0 30px rgba(255,204,0,0.8); }

#pauseBtn {
  left:14px;
  background:linear-gradient(135deg, #1a1a1a, #000);
  color:#fff; border:2px solid #fff;
  box-shadow:0 0 20px rgba(255,255,255,0.4);
}

/* MOD PANEL */
#modPanel {
  position:fixed; top:78px; right:14px; width:320px; max-height:80vh;
  overflow-y:auto; background:rgba(10,10,30,0.97);
  color:#fff; border:2px solid #ffcc00; border-radius:16px;
  padding:18px; z-index:101; font-family:'Rubik',sans-serif;
  display:none; box-shadow:0 8px 40px rgba(0,0,0,0.8), 0 0 30px rgba(255,204,0,0.2);
  backdrop-filter:blur(12px);
}
#modPanel.show { display:block; animation:slideIn 0.25s ease; }
#modPanel h2 {
  font-family:'Bungee',cursive; color:#ffcc00; margin-bottom:14px;
  text-align:center; letter-spacing:2px; font-size:20px;
}
#modPanel label {
  display:flex; justify-content:space-between; align-items:center;
  margin:8px 0; font-size:13px; gap:8px; color:#ccc;
}
#modPanel input[type="number"], #modPanel input[type="text"] {
  width:120px; padding:6px 8px; background:#050518; color:#fff;
  border:1px solid #444; border-radius:6px; font-family:'Rubik',sans-serif;
}
#modPanel input[type="checkbox"] { width:18px; height:18px; accent-color:#ffcc00; }
#modPanel button {
  width:100%; margin-top:14px; padding:10px; background:linear-gradient(135deg,#ffcc00,#ff9900);
  color:#000; border:none; border-radius:10px; font-weight:800;
  cursor:pointer; font-family:'Bungee',cursive; letter-spacing:1px;
  transition:transform 0.15s;
}
#modPanel button:active { transform:scale(0.97); }

/* OVERLAYS */
.overlay {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px; padding:24px;
  background:radial-gradient(circle at center, rgba(20,20,60,0.95), rgba(5,5,24,0.98));
  z-index:20; pointer-events:auto;
  animation:fadeIn 0.3s ease;
  overflow-y:auto;
}
.overlay.hidden { display:none !important; }

@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes slideIn { from{opacity:0;transform:translateX(20px);} to{opacity:1;transform:translateX(0);} }
@keyframes pop { 0%{transform:scale(0.9);opacity:0;} 100%{transform:scale(1);opacity:1;} }

h1 {
  font-family:'Bungee',cursive; font-size:clamp(32px,7vw,52px);
  color:#ffcc00; letter-spacing:4px; text-align:center;
  text-shadow:
    0 0 20px rgba(255,204,0,0.7),
    0 0 40px rgba(255,153,0,0.5),
    4px 4px 0 #000;
  animation:pop 0.4s ease;
}
h2 {
  font-family:'Bungee',cursive; font-size:24px; color:#ffcc00;
  letter-spacing:2px; text-shadow:2px 2px 0 #000;
}

p { font-size:15px; color:#ccc; text-align:center; max-width:340px; }

input, select {
  padding:14px 18px; font-size:16px; width:min(320px, 90vw);
  border-radius:12px; border:2px solid rgba(255,204,0,0.4);
  background:rgba(5,5,24,0.9); color:#fff; font-family:'Rubik',sans-serif;
  outline:none; transition:border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus {
  border-color:#ffcc00; box-shadow:0 0 20px rgba(255,204,0,0.4);
}
input::placeholder { color:#666; }

button {
  padding:14px 36px; font-size:16px; border:none; border-radius:12px;
  background:linear-gradient(135deg, #ffcc00, #ff9900);
  color:#000; font-weight:800; font-family:'Bungee',cursive;
  letter-spacing:1px; cursor:pointer; min-width:200px;
  box-shadow:0 4px 0 #aa6600, 0 0 20px rgba(255,204,0,0.4);
  transition:transform 0.1s, box-shadow 0.2s;
}
button:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 #aa6600, 0 0 15px rgba(255,204,0,0.6);
}
button.secondary {
  background:linear-gradient(135deg, #2a2a4a, #1a1a3a);
  color:#fff; box-shadow:0 4px 0 #0a0a1a, 0 0 15px rgba(100,100,255,0.2);
}
button:disabled { opacity:0.5; cursor:not-allowed; }

/* TABS */
.tabs {
  display:flex; gap:8px; margin-bottom:8px;
  background:rgba(0,0,0,0.4); padding:6px; border-radius:14px;
  border:1px solid rgba(255,204,0,0.2);
}
.tabs button {
  padding:10px 22px; font-size:14px; min-width:auto;
  background:transparent; color:#888; box-shadow:none;
  border-radius:10px; font-family:'Rubik',sans-serif; font-weight:600;
  letter-spacing:0;
}
.tabs button.active {
  background:linear-gradient(135deg,#ffcc00,#ff9900); color:#000;
  box-shadow:0 0 15px rgba(255,204,0,0.5);
}

/* PANES */
#paneGuest, #paneLogin, #paneRegister {
  display:flex; flex-direction:column; gap:12px; align-items:center;
}

.err {
  color:#ff5566; font-size:13px; max-width:320px; text-align:center;
  min-height:18px; font-weight:600;
}

.small {
  font-size:12px; color:#777; max-width:320px; text-align:center;
  line-height:1.5;
}

/* LEADERBOARD */
#lbList {
  max-height:50vh; overflow-y:auto; width:min(420px,92vw);
  font-family:'Rubik',sans-serif; font-size:14px;
  background:rgba(0,0,0,0.4); border-radius:12px; padding:8px;
  border:1px solid rgba(255,204,0,0.2);
}
#lbList div {
  display:flex; justify-content:space-between; padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,0.05); color:#ddd;
}
#lbList div:first-child { color:#ffd700; font-weight:800; text-shadow:0 0 8px rgba(255,215,0,0.5); }
#lbList div:nth-child(2) { color:#c0c0c0; font-weight:700; }
#lbList div:nth-child(3) { color:#cd7f32; font-weight:700; }

/* CHARACTERS */
#charList {
  display:flex; flex-direction:column; gap:10px;
  width:min(360px, 92vw); max-height:55vh; overflow-y:auto; padding:4px;
}
.charRow {
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; padding:14px; background:rgba(0,0,0,0.5);
  border:2px solid rgba(255,204,0,0.2); border-radius:14px;
  transition:border-color 0.2s, transform 0.15s;
}
.charRow:hover { border-color:rgba(255,204,0,0.6); transform:translateY(-2px); }
.charRow.selected { border-color:#ffcc00; box-shadow:0 0 20px rgba(255,204,0,0.4); }
.charColor {
  width:32px; height:32px; border-radius:8px;
  box-shadow:0 0 12px currentColor, inset 0 0 8px rgba(255,255,255,0.3);
}
.charName { font-family:'Bungee',cursive; font-size:16px; letter-spacing:1px; }
.charRow button { min-width:auto; padding:8px 16px; font-size:12px; }

/* ADMIN LINK */
#adminLink {
  color:#0ff; font-size:14px; margin-top:10px;
  text-decoration:none; padding:8px 16px;
  border:1px solid #0ff; border-radius:8px;
  transition:background 0.2s;
}
#adminLink:hover { background:rgba(0,255,255,0.1); }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,204,0,0.3); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,204,0,0.6); }
</style>

<body>

<canvas id="game"></canvas>

<div id="modBtn" class="iconBtn">G</div>
<div id="modPanel">

  <label>Godmode <input id="modGod" type="checkbox" /></label>

<div id="pauseBtn" class="iconBtn">II</div>

<div id="hud">

  <div id="coins">COINS: 0</div>
  <div id="players"></div>
</div>

<!-- START MENU -->
<div id="startMenu" class="overlay">
  <h1>SUBWAY SURFERS</h1>
  <div class="tabs">
    <button id="tabGuest" class="active">Gast</button>

  </div>

  <div id="paneGuest">
    <input id="guestName" placeholder="Dein Name" maxlength="16" />
    <div id="guestErr" class="err"></div>

    <input id="regName" placeholder="Name" maxlength="16" />
    <input id="regEmail" placeholder="Email" />

    <button id="regBtn">Account erstellen</button>
  </div>

  <button id="lbBtn" class="secondary">Leaderboard</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="overlay hidden">
  <h1>BEREIT</h1>
  <p id="welcomeText">Eingeloggt als: -</p>
  <input id="roomInput" placeholder="Room Code" maxlength="12" value="default" />
  <button id="soloBtn">SOLO SPIELEN</button>
  <button id="mpBtn">MULTIPLAYER</button>
  <button id="charBtn" class="secondary">Charaktere</button>
  <button id="logoutBtn" class="secondary">Logout</button>
</div>

<!-- CHARACTERS -->
<div id="charMenu" class="overlay hidden">
  <h1>CHARAKTERE</h1>
  <div id="charList"></div>

</div>

<!-- PAUSE -->
<div id="pauseMenu" class="overlay hidden">
  <h1>PAUSE</h1>
  <button id="resumeBtn">Weiter</button>

  <h1>GAME OVER</h1>

<!-- LEADERBOARD -->
<div id="lbMenu" class="overlay hidden">
  <h1>LEADERBOARD</h1>
  <div id="lbList"></div>
  <button id="lbBack" class="secondary">Zurück</button>
</div>

<script type="module">
console.log('SCRIPT GESTARTET');

/* ============================================================
   SERVICE WORKER
   ============================================================ */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'subway-surfers-v3';
    const ASSETS = ['/','/index.html'];
    self.addEventListener('install', (e) => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
      self.skipWaiting();
    });
    self.addEventListener('activate', (e) => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', (e) => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
          const copy = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, copy));
          return resp;
        }))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

/* ============================================================
   STATE
   ============================================================ */
const API = '';
let AUTH = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null')
};
let isGuest = false;
let guestLocal = JSON.parse(localStorage.getItem('guestData') || 'null') || {
  high_score: 0, total_coins: 0, selected_character: 'jake', unlocked_characters: 'jake'
};

const CHARACTERS = [
  { id:'jake',   name:'Jake',   color:0xff4444, cost:0 },
  { id:'tricky', name:'Tricky', color:0x44ff88, cost:500 },
  { id:'fresh',  name:'Fresh',  color:0x44aaff, cost:1500 },
  { id:'yutani', name:'Yutani', color:0xffaa00, cost:3000 }
];

const MOD = {
  coins:0, score:0, speed:0.25, laneDelay:15, jumpHeight:2.2,
  obsRate:0.4, coinRate:0.6, fogNear:20, fogFar:80,
  bg:0x0a0a2a, playerColor:0xff4444, god:false, infJump:false, mult:1
};

let THREE, renderer, scene, camera;
let player, playerLane = 1;
const LANE_X = [-2.2, 0, 2.2];
let speed = 0.25, baseSpeed = 0.25;
let score = 0, coins = 0;
let running = false, paused = false, multiplayer = false;
let socket = null, room = 'default';
let remotePlayers = {};
let trackSegments = [], obstacles = [], coinObjects = [];
let clock;
let jumpY = 0, jumpVel = 0, jumping = false;
let heartbeatInterval = null;

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const canvas = $('game');
const scoreEl = $('score'), coinsEl = $('coins'), playersEl = $('players');
const startMenu = $('startMenu'), lobby = $('lobby'), gameoverEl = $('gameover');
const pauseMenu = $('pauseMenu'), charMenu = $('charMenu'), lbMenu = $('lbMenu');
const modBtn = $('modBtn'), modPanel = $('modPanel'), pauseBtn = $('pauseBtn');

/* ============================================================
   THREE
   ============================================================ */
async function loadThree() {
  if (THREE) return THREE;
  THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js');
  return THREE;
}

/* ============================================================
   API
   ============================================================ */
async function api(path, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (AUTH.token) headers['Authorization'] = 'Bearer ' + AUTH.token;
  const res = await fetch(API + path, {
    method, headers,
    body: body ? JSON.stringify(body) : null
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

/* ============================================================
   TABS
   ============================================================ */
function showTab(name) {
  ['Guest','Login','Register'].forEach(t => {
    $('tab' + t).classList.toggle('active', t === name);
    $('pane' + t).classList.toggle('hidden', t !== name);
  });
}
$('tabGuest').onclick = () => showTab('Guest');
$('tabLogin').onclick = () => showTab('Login');
$('tabRegister').onclick = () => showTab('Register');

/* ============================================================
   AUTH
   ============================================================ */
$('guestPlay').onclick = async () => {
  const name = $('guestName').value.trim();
  $('guestErr').textContent = '';
  if (name.length < 2) { $('guestErr').textContent = 'Name zu kurz'; return; }
  const r = await api('/api/guest/register', 'POST', { name });
  if (!r.ok) { $('guestErr').textContent = r.data.error || 'Fehler'; return; }
  AUTH.token = r.data.token;
  AUTH.user = r.data.user;
  isGuest = true;
  localStorage.setItem('token', AUTH.token);
  localStorage.setItem('user', JSON.stringify(AUTH.user));
  enterLobby();
};

$('loginBtn').onclick = async () => {
  const email = $('loginEmail').value.trim();
  const password = $('loginPw').value;
  $('loginErr').textContent = '';
  const r = await api('/api/login', 'POST', { email, password });
  if (!r.ok) { $('loginErr').textContent = r.data.error || 'Fehler'; return; }
  AUTH.token = r.data.token;
  AUTH.user = r.data.user;
  isGuest = false;
  localStorage.setItem('token', AUTH.token);
  localStorage.setItem('user', JSON.stringify(AUTH.user));
  enterLobby();
};

$('regBtn').onclick = async () => {
  const username = $('regName').value.trim();
  const email = $('regEmail').value.trim();
  const password = $('regPw').value;
  $('regErr').textContent = '';
  const r = await api('/api/register', 'POST', { username, email, password });
  if (!r.ok) { $('regErr').textContent = r.data.error || 'Fehler'; return; }
  AUTH.token = r.data.token;
  AUTH.user = r.data.user;
  isGuest = false;
  localStorage.setItem('token', AUTH.token);
  localStorage.setItem('user', JSON.stringify(AUTH.user));
  enterLobby();
};

$('logoutBtn').onclick = () => {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  localStorage.removeItem('owner_player_token');
  AUTH.token = null; AUTH.user = null;
  if (socket) { socket.disconnect(); socket = null; }
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  lobby.classList.add('hidden');
  startMenu.classList.remove('hidden');
  modBtn.classList.remove('show');
  pauseBtn.classList.remove('show');
};

$('lbBtn').onclick = async () => {
  const r = await api('/api/leaderboard');
  const list = $('lbList');
  list.innerHTML = '';
  (r.data.leaderboard || []).forEach((e, i) => {
    const d = document.createElement('div');
    d.innerHTML = `<span>#${i+1} ${e.name}</span><span>${e.score}</span>`;
    list.appendChild(d);
  });
  lbMenu.classList.remove('hidden');
};
$('lbBack').onclick = () => lbMenu.classList.add('hidden');

function enterLobby() {
  startMenu.classList.add('hidden');
  lobby.classList.remove('hidden');
  $('welcomeText').textContent = 'Eingeloggt als: ' + AUTH.user.username +
    (isGuest ? ' (Gast)' : ' (' + AUTH.user.role + ')');

  if (AUTH.user.role === 'owner') {
    modBtn.classList.add('show');
    document.cookie = `owner_player_token=${AUTH.token}; path=/; max-age=${60*60*24*30}; secure; samesite=Lax`;
    if (!$('adminLink')) {
      const a = document.createElement('a');
      a.id = 'adminLink';
      a.href = '/admin';
      a.target = '_blank';
      a.textContent = 'ADMIN PANEL ÖFFNEN';
      lobby.appendChild(a);
    }
  }

  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => { api('/api/heartbeat', 'POST'); }, 60000);
}

/* ============================================================
   CHARAKTERE
   ============================================================ */
$('charBtn').onclick = () => { renderCharMenu(); charMenu.classList.remove('hidden'); };
$('charBack').onclick = () => charMenu.classList.add('hidden');

function getProgress() {
  if (isGuest) return guestLocal;
  return {
    high_score: AUTH.user.high_score || 0,
    total_coins: AUTH.user.total_coins || 0,
    selected_character: AUTH.user.selected_character || 'jake',
    unlocked_characters: AUTH.user.unlocked_characters || 'jake'
  };
}
function saveGuestProgress() { localStorage.setItem('guestData', JSON.stringify(guestLocal)); }

function renderCharMenu() {
  const prog = getProgress();
  const unlocked = (prog.unlocked_characters || 'jake').split(',');
  const list = $('charList');
  list.innerHTML = '';
  CHARACTERS.forEach(c => {
    const owned = unlocked.includes(c.id);
    const selected = prog.selected_character === c.id;
    const colorHex = '#' + c.color.toString(16).padStart(6,'0');
    const row = document.createElement('div');
    row.className = 'charRow' + (selected ? ' selected' : '');
    row.innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="charColor" style="background:${colorHex};color:${colorHex};"></div>
        <span class="charName">${c.name}</span>
      </div>
      <div>
        ${owned
          ? `<button data-pick="${c.id}" ${selected ? 'disabled' : ''}>${selected ? 'Aktiv' : 'Wählen'}</button>`
          : `<button data-buy="${c.id}">${c.cost} Coins</button>`}
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.pick;
      if (isGuest) { guestLocal.selected_character = id; saveGuestProgress(); }
      else {
        AUTH.user.selected_character = id;
        localStorage.setItem('user', JSON.stringify(AUTH.user));
        api('/api/save','POST',{score:0,coins:0,character:id,unlocked:getProgress().unlocked_characters});
      }
      renderCharMenu();
    };
  });
  list.querySelectorAll('[data-buy]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.buy;
      const c = CHARACTERS.find(x => x.id === id);
      const prog = getProgress();
      if (prog.total_coins < c.cost) { alert('Nicht genug Coins'); return; }
      const newUnlocked = (prog.unlocked_characters || 'jake') + ',' + id;
      if (isGuest) {
        guestLocal.total_coins -= c.cost;
        guestLocal.unlocked_characters = newUnlocked;
        guestLocal.selected_character = id;
        saveGuestProgress();
      } else {
        AUTH.user.total_coins -= c.cost;
        AUTH.user.unlocked_characters = newUnlocked;
        AUTH.user.selected_character = id;
        localStorage.setItem('user', JSON.stringify(AUTH.user));
        api('/api/save','POST',{score:0,coins:-c.cost,character:id,unlocked:newUnlocked});
      }
      renderCharMenu();
    };
  });
}

/* ============================================================
   SPIELSTART
   ============================================================ */
$('soloBtn').onclick = () => { room = $('roomInput').value || 'default'; startGame(false); };
$('mpBtn').onclick = () => { room = $('roomInput').value || 'default'; startGame(true); };
$('retryBtn').onclick = () => startGame(multiplayer);
$('backLobby').onclick = () => { gameoverEl.classList.add('hidden'); lobby.classList.remove('hidden'); };

$('pauseBtn').onclick = () => { if (running) { paused = true; pauseMenu.classList.remove('hidden'); } };
$('resumeBtn').onclick = () => { paused = false; pauseMenu.classList.add('hidden'); };
$('pauseSave').onclick = async () => {
  await saveProgress();
  paused = false; running = false;
  pauseMenu.classList.add('hidden');
  lobby.classList.remove('hidden');
  pauseBtn.classList.remove('show');
};

async function saveProgress() {
  const prog = getProgress();
  const char = prog.selected_character || 'jake';
  const unlocked = prog.unlocked_characters || 'jake';
  if (isGuest) {
    guestLocal.high_score = Math.max(guestLocal.high_score || 0, score);
    guestLocal.total_coins = (guestLocal.total_coins || 0) + coins;
    guestLocal.selected_character = char;
    guestLocal.unlocked_characters = unlocked;
    saveGuestProgress();
    if (AUTH.token) api('/api/save', 'POST', { score, coins, character: char, unlocked });
  } else {
    const r = await api('/api/save', 'POST', { score, coins, character: char, unlocked });
    if (r.ok) {
      AUTH.user.high_score = r.data.high_score;
      AUTH.user.total_coins = r.data.total_coins;
      localStorage.setItem('user', JSON.stringify(AUTH.user));
    }
  }
}

/* ============================================================
   THREE INIT
   ============================================================ */
async function initThree() {
  await loadThree();
  scene = new THREE.Scene();
  scene.background = new THREE.Color(MOD.bg);
  scene.fog = new THREE.Fog(MOD.bg, MOD.fogNear, MOD.fogFar);

  camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
  camera.position.set(0, 5, 9);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 20, 10);
  scene.add(dir);

  const pGeo = new THREE.BoxGeometry(0.9, 1.6, 0.9);
  const pMat = new THREE.MeshLambertMaterial({ color: MOD.playerColor });
  player = new THREE.Mesh(pGeo, pMat);
  player.position.set(0, 0.8, 0);
  scene.add(player);

  buildTrack();
  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

const SEG_LEN = 20, SEG_COUNT = 10;
function buildTrack() {
  for (let i = 0; i < SEG_COUNT; i++) {
    const seg = createSegment(i * -SEG_LEN);
    scene.add(seg);
    trackSegments.push(seg);
  }
}
function createSegment(z) {
  const g = new THREE.Group();
  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(9, 0.2, SEG_LEN),
    new THREE.MeshLambertMaterial({ color: 0x333344 })
  );
  ground.position.set(0, -0.1, z);
  g.add(ground);
  const railMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
  for (const x of [-3, 3]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, SEG_LEN), railMat);
    rail.position.set(x, 0.15, z);
    g.add(rail);
  }
  const divMat = new THREE.MeshLambertMaterial({ color: 0x666677 });
  for (const x of [-1.1, 1.1]) {
    const div = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, SEG_LEN), divMat);
    div.position.set(x, 0.02, z);
    g.add(div);
  }
  return g;
}
function spawnObstacle(z) {
  const lane = Math.floor(Math.random() * 3);
  const type = Math.random();
  let mesh;
  if (type < 0.5) {
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshLambertMaterial({ color: 0x884400 })
    );
    mesh.position.set(LANE_X[lane], 0.6, z);
  } else {
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, 0.8, 2.4),
      new THREE.MeshLambertMaterial({ color: 0x00aa66 })
    );
    mesh.position.set(LANE_X[lane], 1.6, z);
  }
  scene.add(mesh);
  obstacles.push(mesh);
}
function spawnCoin(z) {
  const lane = Math.floor(Math.random() * 3);
  const geo = new THREE.TorusGeometry(0.25, 0.08, 8, 16);
  const mat = new THREE.MeshLambertMaterial({ color: 0xffd700, emissive: 0x554400 });
  const c = new THREE.Mesh(geo, mat);
  c.position.set(LANE_X[lane], 0.8, z);
  c.rotation.x = Math.PI / 2;
  scene.add(c);
  coinObjects.push(c);
}
function spawnInitialObstacles() {
  for (let i = 1; i < SEG_COUNT; i++) {
    if (Math.random() < MOD.obsRate) spawnObstacle(-i * SEG_LEN - Math.random() * 8);
    if (Math.random() < MOD.coinRate) spawnCoin(-i * SEG_LEN - Math.random() * 8);
  }
}
function recycle() {
  for (const seg of trackSegments) {
    seg.position.z += speed;
    if (seg.position.z > SEG_LEN * 2) {
      seg.position.z -= SEG_LEN * SEG_COUNT;
      if (Math.random() < MOD.obsRate) spawnObstacle(seg.position.z - SEG_LEN / 2);
      if (Math.random() < MOD.coinRate) spawnCoin(seg.position.z - SEG_LEN / 2);
    }
  }
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.position.z += speed;
    if (o.position.z > 10) { scene.remove(o); obstacles.splice(i, 1); }
  }
  for (let i = coinObjects.length - 1; i >= 0; i--) {
    const c = coinObjects[i];
    c.position.z += speed;
    c.rotation.z += 0.1;
    if (c.position.z > 10) { scene.remove(c); coinObjects.splice(i, 1); }
  }
}
function checkCollisions() {
  const px = player.position.x, pz = player.position.z;
  for (const o of obstacles) {
    if (Math.abs(o.position.z - pz) < 0.9 && Math.abs(o.position.x - px) < 0.9) {
      if (o.position.y > 1.0 && jumpY > 0.8) continue;
      if (MOD.god) continue;
      gameOver();
      return;
    }
  }
  for (let i = coinObjects.length - 1; i >= 0; i--) {
    const c = coinObjects[i];
    if (Math.abs(c.position.z - pz) < 0.8 && Math.abs(c.position.x - px) < 0.8) {
      scene.remove(c);
      coinObjects.splice(i, 1);
      coins += MOD.mult;
      coinsEl.textContent = 'COINS: ' + coins;
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (!running || paused) return;
  if (e.key === 'Escape') { paused = true; pauseMenu.classList.remove('hidden'); return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && (MOD.infJump || !jumping)) {
    jumpVel = MOD.jumpHeight;
    jumping = true;
  }
});
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchend', (e) => {
  if (!running || paused) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 40) moveLane(dx > 0 ? 1 : -1);
  } else {
    if (dy < -40 && (MOD.infJump || !jumping)) { jumpVel = MOD.jumpHeight; jumping = true; }
  }
});
function moveLane(dir) { playerLane = Math.max(0, Math.min(2, playerLane + dir)); }

function animate() {
  requestAnimationFrame(animate);
  if (!renderer) return;
  const dt = clock.getDelta();

  if (running && !paused) {
    const targetX = LANE_X[playerLane];
    player.position.x += (targetX - player.position.x) * Math.min(1, dt * MOD.laneDelay);

    speed += 0.00005;
    if (speed > 0.6) speed = 0.6;
    speed = Math.min(speed, MOD.speed + 0.35);

    score += Math.floor(speed * 100 * dt) * MOD.mult;
    scoreEl.textContent = 'SCORE: ' + score;

    if (jumping) {
      player.position.y = 0.8 + jumpY;
      jumpY += jumpVel * dt * 6;
      jumpVel -= 9.8 * dt;
      if (player.position.y <= 0.8) {
        player.position.y = 0.8;
        jumpY = 0; jumpVel = 0; jumping = false;
      }
    } else {
      player.position.y = 0.8 + Math.sin(performance.now() * 0.01) * 0.05;
    }

    recycle();
    checkCollisions();

    if (multiplayer && socket) {
      socket.emit('update', {
        room, x: player.position.x, y: player.position.y, z: player.position.z,
        score, lane: playerLane, alive: true
      });
    }
  }

  for (const id in remotePlayers) {
    const rp = remotePlayers[id];
    if (!rp.mesh) {
      const g = new THREE.BoxGeometry(0.9, 1.6, 0.9);
      const m = new THREE.MeshLambertMaterial({ color: 0x44aaff });
      rp.mesh = new THREE.Mesh(g, m);
      scene.add(rp.mesh);
    }
    rp.mesh.position.set(rp.x, rp.y || 0.8, rp.z || 0);
  }

  renderer.render(scene, camera);
}

function startGame(mp) {
  multiplayer = mp;
  score = 0; coins = 0; speed = baseSpeed; playerLane = 1;
  scoreEl.textContent = 'SCORE: 0';
  coinsEl.textContent = 'COINS: 0';

  for (const o of obstacles) scene.remove(o);
  for (const c of coinObjects) scene.remove(c);
  obstacles = []; coinObjects = [];
  for (const id in remotePlayers) {
    if (remotePlayers[id].mesh) scene.remove(remotePlayers[id].mesh);
  }
  remotePlayers = {};

  const prog = getProgress();
  const char = CHARACTERS.find(c => c.id === prog.selected_character) || CHARACTERS[0];
  player.material.color.setHex(char.color);

  spawnInitialObstacles();
  player.position.set(0, 0.8, 0);

  lobby.classList.add('hidden');
  charMenu.classList.add('hidden');
  startMenu.classList.add('hidden');
  gameoverEl.classList.add('hidden');
  pauseMenu.classList.add('hidden');
  pauseBtn.classList.add('show');
  running = true; paused = false;

  if (multiplayer) {
    if (socket) socket.disconnect();
    socket = io();
    socket.on('connect', () => {
      socket.emit('joinRoom', { room, name: AUTH.user.username });
    });
    socket.on('roomState', (state) => {
      for (const id in state) {
        if (id === socket.id) continue;
        remotePlayers[id] = state[id];
      }
    });
    socket.on('playerUpdate', (p) => { remotePlayers[p.id] = p; });
    socket.on('playerLeft', (id) => {
      if (remotePlayers[id] && remotePlayers[id].mesh) scene.remove(remotePlayers[id].mesh);
      delete remotePlayers[id];
    });
  }
}

async function gameOver() {
  running = false;
  pauseBtn.classList.remove('show');
  $('finalScore').textContent = 'Score: ' + score + '  Coins: ' + coins;
  gameoverEl.classList.remove('hidden');
  if (multiplayer && socket) socket.emit('gameOver', { room, score });
  await saveProgress();
}

/* ============================================================
   MOD MENU
   ============================================================ */
modBtn.onclick = () => modPanel.classList.toggle('show');
$('modClose').onclick = () => modPanel.classList.remove('show');
function bindMod(id, key, tf = v => v) {
  const el = $(id);
  el.addEventListener('input', () => {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') v = parseFloat(v);
    MOD[key] = tf(v);
    applyMods();
  });
}
bindMod('modCoins', 'coins', v => { coins = v; coinsEl.textContent = 'COINS: ' + coins; return v; });
bindMod('modScore', 'score', v => { score = v; scoreEl.textContent = 'SCORE: ' + score; return v; });
bindMod('modSpeed', 'speed', v => { speed = v; baseSpeed = v; return v; });
bindMod('modLaneDelay', 'laneDelay');
bindMod('modJump', 'jumpHeight');
bindMod('modObsRate', 'obsRate');
bindMod('modCoinRate', 'coinRate');
bindMod('modGod', 'god');
bindMod('modInfJump', 'infJump');
bindMod('modMult', 'mult');
function applyMods() {
  if (scene) { scene.background = new THREE.Color(MOD.bg); }
  if (player) { player.material.color.setHex(MOD.playerColor); }
}

/* ============================================================
   AUTOLOGIN
   ============================================================ */
async function tryAutoLogin() {
  if (!AUTH.token) return false;
  const r = await api('/api/me');
  if (!r.ok) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    AUTH.token = null; AUTH.user = null;
    return false;
  }
  AUTH.user = r.data;
  isGuest = !!r.data.is_guest;
  localStorage.setItem('user', JSON.stringify(AUTH.user));
  enterLobby();
  return true;
}

/* ============================================================
   BOOT
   ============================================================ */
initThree();
tryAutoLogin();
</script>
