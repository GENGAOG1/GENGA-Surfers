<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Genga Surfer</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genga Surfer">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a1a;
      color: #fff;
    }
    body { display: flex; align-items: center; justify-content: center; }

    #menu {
      text-align: center;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      height: 100%;
      overflow-y: auto;
    }
    h1 {
      color: #00e5ff;
      margin-bottom: 20px;
      letter-spacing: 3px;
      font-size: 28px;
      text-shadow: 0 0 20px rgba(0,229,255,0.5);
    }
    button, input, select {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      background: #00e5ff;
      color: #000;
      font-weight: bold;
      transition: background 0.15s;
    }
    button:hover { background: #00b8cc; }
    button:active { transform: scale(0.98); }
    hr { margin: 16px 0; border: none; border-top: 1px solid #333; }
    #auth-box { margin-top: 16px; }
    #user-info { margin-bottom: 12px; color: #888; font-size: 14px; }
    .hidden { display: none !important; }

    canvas {
      display: block;
      touch-action: none;
      background: #0a0a1a;
    }

    #pause-overlay, #gameover-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
      padding: 24px;
    }
    #pause-overlay button, #gameover-overlay button { width: 220px; }
    #gameover-overlay h2 { color: #ff4d4d; font-size: 32px; margin-bottom: 8px; }
    #gameover-overlay .stat { font-size: 18px; color: #00e5ff; }
    #pause-overlay h2 { color: #00e5ff; font-size: 32px; }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      z-index: 50;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #hud .score { color: #00e5ff; }
    #hud .coins { color: #ffaa00; }
    #btn-pause-hud {
      pointer-events: auto;
      background: rgba(0,0,0,0.5);
      border: 1px solid #333;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      padding: 0;
      margin: 0;
      font-size: 18px;
    }

    #leaderboard-list {
      margin-top: 16px;
      text-align: left;
      max-height: 60vh;
      overflow-y: auto;
    }
    #leaderboard-list .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #222;
    }
    #leaderboard-list .row:nth-child(1) { color: #ffd700; }
    #leaderboard-list .row:nth-child(2) { color: #c0c0c0; }
    #leaderboard-list .row:nth-child(3) { color: #cd7f32; }
  </style>
</head>
<body>

  <!-- MENU -->
  <div id="menu">
    <h1>GENGA SURFER</h1>
    <div id="user-info"></div>

    <div id="view-main">
      <button id="btn-play">▶ Spielen</button>
      <button id="btn-leaderboard">🏆 Leaderboard</button>
      <button id="btn-difficulty">⚙ Schwierigkeit: <span id="diff-label">Normal</span></button>
      <button id="btn-logout" class="hidden" style="background:#333;color:#fff">Logout</button>

      <div id="auth-box">
        <hr>
        <input id="guest-name" placeholder="Gast-Name" maxlength="24">
        <button id="btn-guest">Als Gast spielen</button>
        <hr>
        <input id="email" placeholder="E-Mail" type="email" autocomplete="email">
        <input id="password" placeholder="Passwort (min. 6)" type="password" autocomplete="current-password">
        <input id="reg-name" placeholder="Anzeigename (optional)" maxlength="24">
        <button id="btn-login">Login</button>
        <button id="btn-register" style="background:#333;color:#fff">Registrieren</button>
      </div>
    </div>

    <div id="view-leaderboard" class="hidden">
      <h2 style="color:#00e5ff;margin-bottom:12px">🏆 Top 50</h2>
      <div id="leaderboard-list"></div>
      <button id="btn-back-leaderboard" style="margin-top:16px;background:#333;color:#fff">Zurück</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div><span class="score" id="hud-score">0</span> · <span class="coins" id="hud-coins">0</span>🪙</div>
    <button id="btn-pause-hud">⏸</button>
  </div>

  <!-- CANVAS -->
  <canvas id="game" class="hidden"></canvas>

  <!-- PAUSE -->
  <div id="pause-overlay" class="hidden">
    <h2>Pause</h2>
    <button id="btn-resume">Weiter</button>
    <button id="btn-quit" style="background:#333;color:#fff">Zum Menü</button>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-overlay" class="hidden">
    <h2>GAME OVER</h2>
    <div class="stat">Score: <span id="go-score">0</span></div>
    <div class="stat">Best: <span id="go-best">0</span></div>
    <div class="stat">Coins: <span id="go-coins">0</span>🪙</div>
    <button id="btn-restart">Nochmal</button>
    <button id="btn-menu" style="background:#333;color:#fff">Zum Menü</button>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
