<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <meta name="theme-color" content="#07152d">
    <title>Genga Surfer</title>
    <!-- Flask: richtige CSS-Datei laden -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>
<body>
    <main id="game">
        <!-- 3D-Spielbereich -->
        <div id="gameCanvas"></div>
        <!-- HUD -->
        <header class="game-header">
            <div class="hud-box">
                <span>MÜNZEN</span>
                <strong id="coinCount">0</strong>
            </div>
            <div class="hud-box">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>
            <button
                id="pauseButton"
                type="button"
                aria-label="Spiel pausieren"
            >Ⅱ</button>
        </header>
        <!-- HAUPTMENÜ -->
        <section id="startScreen" class="game-screen">
            <h1>GENGA<br>SURFER</h1>
            <p>Endless Runner</p>
            <div class="menu-coins">
                🪙 <span id="menuCoinCount">0</span>
            </div>
            <button id="startButton" type="button">
                SPIELEN
            </button>
            <button
                id="resumeButton"
                class="hidden"
                type="button"
            >
                FORTSETZEN
            </button>
            <button id="openShopButton" type="button">
                🛒 SHOP
            </button>
            <p>
                ← → oder A / D<br>
                oder Wischen zum Bewegen
            </p>
        </section>
        <!-- PAUSE -->
        <section id="pauseScreen" class="game-screen hidden">
            <h1>PAUSE</h1>
            <button id="resumeGameButton" type="button">
                WEITERSPIELEN
            </button>
            <button id="pauseShopButton" type="button">
                🛒 SHOP
            </button>
            <button id="pauseMenuButton" type="button">
                HAUPTMENÜ
            </button>
        </section>
        <!-- GAME OVER -->
        <section id="gameOverScreen" class="game-screen hidden">
            <h1>GAME OVER</h1>
            <p>
                Score:
                <strong id="finalScore">0</strong>
            </p>
            <p>
                Bestwert:
                <strong id="bestScore">0</strong>
            </p>
            <button id="restartButton" type="button">
                NOCHMAL
            </button>
            <button id="gameOverShopButton" type="button">
                🛒 SHOP
            </button>
            <button id="gameOverMenuButton" type="button">
                HAUPTMENÜ
            </button>
        </section>
        <!-- SHOP -->
        <section id="shopScreen" class="game-screen hidden">
            <div class="shop-header">
                <h1>SHOP</h1>
                <button
                    id="closeShopButton"
                    class="back-button"
                    type="button"
                    aria-label="Shop schließen"
                >✕</button>
            </div>
            <div class="shop-coins">
                🪙 <span id="shopCoins">0</span>
            </div>
            <h2>SKINS</h2>
            <div id="skinItems" class="shop-items"></div>
            <h2>UPGRADES</h2>
            <p>
                Kaufe Upgrades für deinen nächsten Run.
            </p>
            <div id="upgradeItems" class="shop-items"></div>
        </section>
        <!-- POWER-UP-HINWEIS -->
        <div id="powerupInfo" class="hidden">
            <span id="powerupText"></span>
        </div>
    </main>
    <!-- Three.js zuerst laden -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <!-- Spielskripte aus static/js -->
    <script src="{{ url_for('static', filename='js/save.js') }}"></script>
    <script src="{{ url_for('static', filename='js/upgrades.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/controls.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
