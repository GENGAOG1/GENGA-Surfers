<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Genga Surfer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="gameContainer"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hudBox">
      🪙 <span id="coinCount">0</span>
    </div>

    <div class="hudBox">
      Score: <span id="score">0</span>
    </div>

    <button id="pauseButton" class="pauseButton">Ⅱ</button>
  </div>

  <!-- START -->
  <div id="startScreen" class="screen">
    <div class="panel">
      <h1>GENGA SURFER</h1>
      <p class="subtitle">Endless Runner</p>

      <div class="menuCoins">
        🪙 <span id="menuCoinCount">0</span>
      </div>

      <button id="startButton" class="mainButton">
        SPIELEN
      </button>

      <button id="resumeButton" class="secondaryButton hidden">
        FORTSETZEN
      </button>

      <button id="openShopButton" class="secondaryButton">
        🛒 SHOP
      </button>

      <p class="controlsText">
        ← → oder Wischen zum Bewegen
      </p>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="screen hidden">
    <div class="panel">
      <h2>PAUSE</h2>

      <button id="resumeGameButton" class="mainButton">
        WEITERSPIELEN
      </button>

      <button id="pauseShopButton" class="secondaryButton">
        🛒 SHOP
      </button>

      <button id="pauseMenuButton" class="secondaryButton">
        HAUPTMENÜ
      </button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen" class="screen hidden">
    <div class="panel">
      <h2>GAME OVER</h2>

      <div class="resultText">
        Score
        <strong id="finalScore">0</strong>
      </div>

      <div class="resultText">
        Bestwert
        <strong id="bestScore">0</strong>
      </div>

      <button id="restartButton" class="mainButton">
        NOCHMAL
      </button>

      <button id="gameOverShopButton" class="secondaryButton">
        🛒 SHOP
      </button>

      <button id="gameOverMenuButton" class="secondaryButton">
        HAUPTMENÜ
      </button>
    </div>
  </div>

  <!-- SHOP -->
  <div id="shopScreen" class="screen hidden">
    <div class="shopPanel">

      <div class="shopHeader">
        <div>
          <h2>SHOP</h2>
          <div class="shopCoins">
            🪙 <span id="shopCoins">0</span>
          </div>
        </div>

        <button id="closeShopButton" class="closeButton">
          ✕
        </button>
      </div>

      <div class="shopSection">
        <h3>SKINS</h3>
        <div id="skinItems" class="shopGrid"></div>
      </div>

      <div class="shopSection">
        <h3>UPGRADES</h3>
        <p class="shopHint">
          Kaufe Upgrades und aktiviere sie vor dem nächsten Run.
        </p>
        <div id="upgradeItems" class="upgradeList"></div>
      </div>

    </div>
  </div>

  <!-- INFO -->
  <div id="powerupInfo" class="powerupInfo hidden">
    <span id="powerupText"></span>
  </div>

  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- GAME SCRIPTS -->
  <script src="upgrades.js"></script>
  <script src="game3d.js"></script>
  <script src="controls.js"></script>
  <script src="game.js"></script>

</body>
</html>
