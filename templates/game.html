<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

    <main id="game">

        <div id="gameCanvas"></div>

        <!-- HUD -->
        <div class="game-header">

            <div class="hud-box">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="hud-box coin-hud">
                <span>🪙</span>
                <strong id="coins">0</strong>
            </div>

            <div class="hud-box">
                <span>Best</span>
                <strong id="highscore">0</strong>
            </div>

            <button
                id="pauseButton"
                type="button"
                aria-label="Spiel pausieren"
            >
                ⏸
            </button>

        </div>


        <!-- START -->
        <div
            id="startScreen"
            class="game-screen"
        >

            <h1>GENGA SURFER</h1>

            <p>Run. Dodge. Survive.</p>

            <div class="start-stats">

                <div>
                    <span>Bestscore</span>
                    <strong id="startHighscore">0</strong>
                </div>

                <div>
                    <span>🪙 Münzen</span>
                    <strong id="startCoins">0</strong>
                </div>

            </div>

            <button
                id="continueButton"
                type="button"
                class="hidden"
            >
                Fortsetzen
            </button>

            <button
                id="startButton"
                type="button"
            >
                Neues Spiel
            </button>

        </div>


        <!-- PAUSE -->
        <div
            id="pauseScreen"
            class="game-screen hidden"
        >

            <h1>PAUSE</h1>

            <p>Dein Spiel wurde gespeichert.</p>

            <button
                id="resumeButton"
                type="button"
            >
                Fortsetzen
            </button>

        </div>


        <!-- GAME OVER -->
        <div
            id="gameOverScreen"
            class="game-screen hidden"
        >

            <h1>GAME OVER</h1>

            <p>
                Score:
                <span id="finalScore">0</span>
            </p>

            <p>
                🪙 Münzen:
                <span id="finalCoins">0</span>
            </p>

            <p id="newHighscoreText" class="new-highscore hidden">
                🏆 NEUER HIGHSCORE!
            </p>

            <button
                id="restartButton"
                type="button"
            >
                Neues Spiel
            </button>

        </div>

    </main>


    <!-- THREE.JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ></script>


    <!-- GAME -->
    <script
        src="{{ url_for('static', filename='js/game3d.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/game.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/controls.js') }}"
    ></script>

</body>
</html>
