<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>GENGA SURFER</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- =====================================
         3D SPIEL
    ====================================== -->

    <div
        id="gameCanvas"
        class="game-canvas"
    ></div>


    <!-- =====================================
         SPIEL HUD
    ====================================== -->

    <div
        id="gameHUD"
        class="game-hud hidden"
    >

        <div class="hud-left">

            <div
                id="hudCoins"
                class="hud-coins"
            >
                🪙 0
            </div>

            <div
                id="hudLives"
                class="hud-lives"
            ></div>

        </div>


        <div
            id="score"
            class="score"
        >
            0
        </div>


        <div class="hud-right">

            <div
                id="hudMultiplier"
                class="hud-multiplier"
            >
                x1
            </div>

            <button
                id="pauseButton"
                class="pause-button"
                type="button"
            >
                ⏸
            </button>

        </div>

    </div>


    <!-- =====================================
         START / HAUPTMENÜ
    ====================================== -->

    <div
        id="startScreen"
        class="overlay"
    >

        <div class="main-menu">

            <div class="game-title">
                GENGA SURFER
            </div>

            <div class="game-subtitle">
                RUN • DODGE • SURVIVE
            </div>


            <!-- MÜNZEN -->

            <div
                id="menuCoins"
                class="menu-coins"
            >
                🪙 0
            </div>


            <!-- SPIELEN -->

            <button
                id="startButton"
                class="main-button"
                type="button"
            >
                SPIELEN
            </button>


            <!-- SHOP BUTTON -->

            <button
                id="shopButton"
                class="menu-button"
                type="button"
            >
                🛒 SHOP
            </button>


            <!-- UPGRADE BUTTON -->

            <button
                id="upgradeButton"
                class="menu-button"
                type="button"
            >
                ⚡ UPGRADES
            </button>


            <!-- AKTIVES UPGRADE -->

            <div
                id="menuActiveUpgrade"
                class="menu-active-upgrade"
            >
                Kein Upgrade aktiv
            </div>

        </div>

    </div>


    <!-- =====================================
         SHOP
    ====================================== -->

    <div
        id="shopScreen"
        class="overlay hidden"
    >

        <div class="panel">

            <div class="panel-header">

                <h2>
                    🛒 SHOP
                </h2>

                <div
                    id="shopCoins"
                    class="panel-coins"
                >
                    🪙 0
                </div>

            </div>


            <div class="panel-subtitle">
                Kaufe Skins und ändere die Farbe deines Spielers.
            </div>


            <div
                id="skinList"
                class="shop-list"
            ></div>


            <button
                id="closeShopButton"
                class="secondary-button"
                type="button"
            >
                ZURÜCK
            </button>

        </div>

    </div>


    <!-- =====================================
         UPGRADES
    ====================================== -->

    <div
        id="upgradeScreen"
        class="overlay hidden"
    >

        <div class="panel">

            <div class="panel-header">

                <h2>
                    ⚡ UPGRADES
                </h2>

                <div
                    id="upgradeCoins"
                    class="panel-coins"
                >
                    🪙 0
                </div>

            </div>


            <div
                id="upgradeMessage"
                class="upgrade-message"
            ></div>


            <div
                id="upgradeList"
                class="upgrade-list"
            ></div>


            <button
                id="closeUpgradeButton"
                class="secondary-button"
                type="button"
            >
                ZURÜCK
            </button>

        </div>

    </div>


    <!-- =====================================
         PAUSE
    ====================================== -->

    <div
        id="pauseScreen"
        class="overlay hidden"
    >

        <div class="pause-panel">

            <h2>
                PAUSIERT
            </h2>


            <button
                id="resumeButton"
                class="main-button"
                type="button"
            >
                ▶ FORTSETZEN
            </button>


            <button
                id="pauseMenuButton"
                class="secondary-button"
                type="button"
            >
                HAUPTMENÜ
            </button>

        </div>

    </div>


    <!-- =====================================
         GAME OVER
    ====================================== -->

    <div
        id="gameOverScreen"
        class="overlay hidden"
    >

        <div class="game-over-panel">

            <div class="game-over-title">
                GAME OVER
            </div>


            <div class="game-over-score-label">
                SCORE
            </div>


            <div
                id="finalScore"
                class="final-score"
            >
                0
            </div>


            <div
                id="finalCoins"
                class="final-coins"
            >
                🪙 +0
            </div>


            <button
                id="restartButton"
                class="main-button"
                type="button"
            >
                NEU STARTEN
            </button>


            <button
                id="gameOverMenuButton"
                class="secondary-button"
                type="button"
            >
                HAUPTMENÜ
            </button>

        </div>

    </div>


    <!-- =====================================
         THREE.JS
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ></script>


    <!-- =====================================
         GENGA JS
    ====================================== -->

    <script
        src="{{ url_for('static', filename='js/upgrades.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/game3d.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/controls.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/game.js') }}"
    ></script>

</body>

</html>
