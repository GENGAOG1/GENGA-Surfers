<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >
</head>

<body>

<main class="game-page">

    <div class="game-header">
        <strong>GENGA SURFER</strong>

        <span>
            Punkte:
            <strong id="score">0</strong>
        </span>
    </div>

    <div id="game">

        <div id="gameCanvas"></div>

        <div id="startScreen" class="game-screen">

            <h1>GENGA SURFER</h1>

            <p>Wische nach links oder rechts.</p>

            <button id="startButton" type="button">
                Spielen
            </button>

        </div>

        <div
            id="gameOverScreen"
            class="game-screen hidden"
        >

            <h1>GAME OVER</h1>

            <p>
                Punkte:
                <strong id="finalScore">0</strong>
            </p>

            <button
                id="restartButton"
                type="button"
            >
                Nochmal spielen
            </button>

        </div>

    </div>

</main>


<!-- THREE.JS -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r180/three.min.js">
</script>


<!-- GENGA SURFER -->
<script src="{{ url_for('static', filename='js/game3d.js') }}"></script>
<script src="{{ url_for('static', filename='js/game.js') }}"></script>
<script src="{{ url_for('static', filename='js/controls.js') }}"></script>

</body>
</html>
