<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<main class="game-page">

    <div class="game-header">
        <strong>GENGA SURFER</strong>

        <span>
            Punkte:
            <strong id="score">0</strong>
        </span>
    </div>

    <div id="game">

        <canvas id="canvas"></canvas>

        <!-- Start -->
        <div id="startScreen" class="screen">

            <h1>GENGA SURFER</h1>

            <p>
                Wische nach links oder rechts,
                um die Spur zu wechseln.
            </p>

            <button id="startButton">
                Spielen
            </button>

        </div>


        <!-- Pause -->
        <div id="pauseScreen" class="screen hidden">

            <h1>PAUSIERT</h1>

            <p>
                Dein Spielstand wurde gespeichert.
            </p>

            <button id="resumeButton">
                Fortsetzen
            </button>

            <button id="newGameButton">
                Neuer Lauf
            </button>

        </div>


        <!-- Game Over -->
        <div id="gameOverScreen" class="screen hidden">

            <h1>GAME OVER</h1>

            <p>
                Punkte:
                <strong id="finalScore">0</strong>
            </p>

            <button id="restartButton">
                Nochmal spielen
            </button>

        </div>

    </div>

</main>


<script>

/* =========================================================
   ELEMENTE
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const pauseScreen =
    document.getElementById("pauseScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startButton =
    document.getElementById("startButton");

const resumeButton =
    document.getElementById("resumeButton");

const newGameButton =
    document.getElementById("newGameButton");

const restartButton =
    document.getElementById("restartButton");

const scoreText =
    document.getElementById("score");

const finalScoreText =
    document.getElementById("finalScore");


/* =========================================================
   SPIELDATEN
========================================================= */

let width = 0;
let height = 0;

let playerLane = 1;

let blocks = [];

let score = 0;

let speed = 0.00035;

let spawnTimer = 0;

let lastTime = 0;

let animationFrame = null;


/*
   running = Spiel läuft gerade
*/
let running = false;


/*
   paused = Spiel wurde pausiert
*/
let paused = false;


/*
   gameOver = Lauf ist beendet
*/
let gameOver = false;


/*
   Damit beim Verlassen nicht
   mehrfach gespeichert wird.
*/
let saveTimer = null;


/* =========================================================
   BLOCK-FARBEN
========================================================= */

const blockColors = [
    "#ff3030",
    "#00aaff",
    "#00cc66",
    "#ffcc00",
    "#aa55ff",
    "#ff6600"
];


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    const pixelRatio =
        window.devicePixelRatio || 1;

    canvas.width =
        width * pixelRatio;

    canvas.height =
        height * pixelRatio;

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   SPUREN
========================================================= */

function laneX(lane) {

    return width * (
        0.20 +
        lane * 0.30
    );
}


/* =========================================================
   HINTERGRUND
========================================================= */

function drawBackground() {

    /*
       Himmel
    */

    ctx.fillStyle = "#263746";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Boden
    */

    ctx.fillStyle = "#202020";

    ctx.beginPath();

    ctx.moveTo(
        width * 0.18,
        height * 0.30
    );

    ctx.lineTo(
        width * 0.82,
        height * 0.30
    );

    ctx.lineTo(
        width,
        height
    );

    ctx.lineTo(
        0,
        height
    );

    ctx.closePath();

    ctx.fill();


    /*
       Drei Spuren
    */

    for (let lane = 0; lane < 3; lane++) {

        const x = laneX(lane);

        ctx.beginPath();

        ctx.moveTo(
            x,
            height * 0.30
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.strokeStyle = "#383838";

        ctx.lineWidth =
            width * 0.20;

        ctx.stroke();
    }
}


/* =========================================================
   SPIELER
========================================================= */

function drawPlayer() {

    const x =
        laneX(playerLane);

    const y =
        height * 0.82;

    const size =
        Math.min(
            width * 0.12,
            55
        );


    /*
       Schatten
    */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 5,
        size * 0.55,
        size * 0.18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Spieler
    */

    ctx.fillStyle =
        "#00d9ff";

    ctx.fillRect(
        x - size / 2,
        y - size,
        size,
        size
    );
}


/* =========================================================
   BLOCK ZEICHNEN
========================================================= */

function drawBlock(block) {

    const x =
        laneX(block.lane);

    const depth =
        block.depth;


    /*
       Block wird größer,
       je näher er kommt.
    */

    const size =
        15 +
        depth * 90;


    const y =
        height * 0.30 +
        depth *
        (height * 0.52);


    /*
       Jede Spur ist gleich breit.
    */

    const laneWidth =
        width * 0.20;


    /*
       Der Block füllt
       die komplette Spur.
    */

    ctx.fillStyle =
        block.color;

    ctx.fillRect(

        x - laneWidth / 2,

        y - size,

        laneWidth,

        size
    );
}


/* =========================================================
   BLOCK GENERATOR
========================================================= */

/*
   Wichtig:

   Wir erzeugen NICHT mehr komplett zufällige
   einzelne Blöcke.

   Stattdessen wird eine sichere Folge erzeugt.

   Es gibt immer mindestens EINE freie Spur.
*/

let lastBlockedLanes = [];


function createBlockPattern() {

    /*
       Anzahl blockierter Spuren:

       meistens 1
       manchmal 2

       niemals 3.
    */

    let amount = 1;

    /*
       Erst ab einer gewissen Punktzahl
       können zwei Spuren blockiert werden.
    */

    if (
        score > 250 &&
        Math.random() < 0.30
    ) {

        amount = 2;
    }


    /*
       Alle Spuren
    */

    const lanes = [
        0,
        1,
        2
    ];


    /*
       Mischen
    */

    lanes.sort(
        () => Math.random() - 0.5
    );


    /*
       Hindernisse erzeugen
    */

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const lane =
            lanes[i];


        /*
           Keine direkte Wiederholung
           desselben Musters.
        */

        if (
            lastBlockedLanes.length === 1 &&
            lastBlockedLanes[0] === lane &&
            amount === 1
        ) {

            continue;
        }


        blocks.push({

            lane: lane,

            depth: 0,

            color:
                blockColors[
                    Math.floor(
                        Math.random() *
                        blockColors.length
                    )
                ]

        });
    }


    lastBlockedLanes =
        lanes.slice(
            0,
            amount
        );
}


/* =========================================================
   KOLLISION
========================================================= */

function checkCollision(block) {

    /*
       Nur wenn der Block wirklich
       beim Spieler angekommen ist.
    */

    if (
        block.lane === playerLane &&
        block.depth >= 0.88 &&
        block.depth <= 1.04
    ) {

        endGame();

        return true;
    }

    return false;
}


/* =========================================================
   SPIEL NEU STARTEN
========================================================= */

function startNewGame() {

    /*
       Alten gespeicherten Lauf entfernen.
    */

    clearSavedGame();


    /*
       Spielwerte zurücksetzen.
    */

    playerLane = 1;

    blocks = [];

    score = 0;

    speed = 0.00035;

    spawnTimer = 0;

    lastBlockedLanes = [];

    running = true;

    paused = false;

    gameOver = false;


    /*
       Menüs schließen.
    */

    hideAllScreens();


    scoreText.textContent =
        "0";


    lastTime =
        performance.now();


    /*
       Alte Animation abbrechen.
    */

    if (animationFrame !== null) {

        cancelAnimationFrame(
            animationFrame
        );
    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame() {

    if (
        !running ||
        gameOver
    ) {

        return;
    }


    running = false;

    paused = true;


    if (animationFrame !== null) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    saveGame();


    showPauseScreen();
}


/* =========================================================
   FORTSETZEN
========================================================= */

function resumeGame() {

    if (
        !paused ||
        gameOver
    ) {

        return;
    }


    paused = false;

    running = true;


    hideAllScreens();


    lastTime =
        performance.now();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    if (gameOver) {

        return;
    }


    running = false;

    paused = false;

    gameOver = true;


    if (animationFrame !== null) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    /*
       Lauf ist beendet.

       Gespeicherten laufenden Spielstand
       nicht mehr fortsetzen.
    */

    clearSavedGame();


    finalScoreText.textContent =
        Math.floor(score);


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    if (!running) {

        return;
    }


    const delta =
        Math.min(
            time - lastTime,
            50
        );


    lastTime =
        time;


    /*
       Punkte
    */

    score +=
        delta * 0.01;


    scoreText.textContent =
        Math.floor(score);


    /*
       Geschwindigkeit
       steigt langsam.
    */

    speed +=
        delta *
        0.000000008;


    /*
       Neue Blockgruppe
    */

    spawnTimer +=
        delta;


    /*
       Genug Abstand zwischen
       den Blockgruppen.

       Dadurch wird das Spiel
       nicht plötzlich unmöglich.
    */

    const spawnDelay =
        Math.max(
            1000,
            1450 -
            score * 1.2
        );


    if (
        spawnTimer >=
        spawnDelay
    ) {

        spawnTimer = 0;

        createBlockPattern();
    }


    /*
       Blöcke bewegen
    */

    for (
        let i = blocks.length - 1;
        i >= 0;
        i--
    ) {

        const block =
            blocks[i];


        block.depth +=
            speed * delta;


        if (
            checkCollision(block)
        ) {

            return;
        }


        /*
           Block ist vorbei.
        */

        if (
            block.depth >
            1.2
        ) {

            blocks.splice(
                i,
                1
            );
        }
    }


    /*
       Zeichnen
    */

    drawBackground();


    /*
       Entfernte Blöcke zuerst.
    */

    blocks
        .sort(
            (a, b) =>
                a.depth -
                b.depth
        )
        .forEach(
            drawBlock
        );


    drawPlayer();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* =========================================================
   SWIPE STEUERUNG
========================================================= */

let touchStartX = null;


canvas.addEventListener(
    "touchstart",
    event => {

        if (!running) {

            return;
        }


        touchStartX =
            event.touches[0].clientX;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        if (
            touchStartX === null ||
            !running
        ) {

            touchStartX = null;

            return;
        }


        const touchEndX =
            event.changedTouches[0].clientX;


        const difference =
            touchEndX -
            touchStartX;


        /*
           Swipe nach links
        */

        if (
            difference < -40
        ) {

            playerLane =
                Math.max(
                    0,
                    playerLane - 1
                );
        }


        /*
           Swipe nach rechts
        */

        else if (
            difference > 40
        ) {

            playerLane =
                Math.min(
                    2,
                    playerLane + 1
                );
        }


        touchStartX = null;

    },
    {
        passive: true
    }
);


/* =========================================================
   MENÜS
========================================================= */

function hideAllScreens() {

    startScreen.classList.add(
        "hidden"
    );

    pauseScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );
}


function showPauseScreen() {

    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    pauseScreen.classList.remove(
        "hidden"
    );
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

const SAVE_KEY =
    "genga_surfer_current_game";


function saveGame() {

    /*
       Nur laufenden/pausierten
       Spielstand speichern.
    */

    if (
        gameOver ||
        (!running && !paused)
    ) {

        return;
    }


    const saveData = {

        version: 1,

        score: score,

        playerLane: playerLane,

        speed: speed,

        spawnTimer: spawnTimer,

        blocks: blocks.map(
            block => ({

                lane:
                    block.lane,

                depth:
                    block.depth,

                color:
                    block.color

            })
        ),

        savedAt:
            Date.now()

    };


    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(
                saveData
            )
        );

    } catch (error) {

        console.error(
            "Spielstand konnte nicht gespeichert werden:",
            error
        );
    }
}


/* =========================================================
   SPIELSTAND LADEN
========================================================= */

function loadGame() {

    try {

        const saved =
            localStorage.getItem(
                SAVE_KEY
            );


        if (!saved) {

            return false;
        }


        const data =
            JSON.parse(saved);


        /*
           Alte/kaputte Spielstände
           ignorieren.
        */

        if (
            data.version !== 1 ||
            !Array.isArray(
                data.blocks
            )
        ) {

            clearSavedGame();

            return false;
        }


        score =
            Number(data.score) || 0;

        playerLane =
            Math.max(
                0,
                Math.min(
                    2,
                    Number(
                        data.playerLane
                    ) || 1
                )
            );

        speed =
            Number(data.speed) ||
            0.00035;

        spawnTimer =
            Number(data.spawnTimer) ||
            0;


        blocks =
            data.blocks.map(
                block => ({

                    lane:
                        Math.max(
                            0,
                            Math.min(
                                2,
                                Number(
                                    block.lane
                                )
                            )
                        ),

                    depth:
                        Number(
                            block.depth
                        ) || 0,

                    color:
                        block.color ||
                        "#00aaff"

                })
            );


        scoreText.textContent =
            Math.floor(score);


        return true;

    } catch (error) {

        console.error(
            "Spielstand konnte nicht geladen werden:",
            error
        );

        clearSavedGame();

        return false;
    }
}


/* =========================================================
   SPIELSTAND LÖSCHEN
========================================================= */

function clearSavedGame() {

    try {

        localStorage.removeItem(
            SAVE_KEY
        );

    } catch (error) {

        console.error(
            "Spielstand konnte nicht gelöscht werden:",
            error
        );
    }
}


/* =========================================================
   BEIM VERLASSEN AUTOMATISCH SPEICHERN
========================================================= */

/*
   visibilitychange ist für Mobile besonders wichtig.

   Wenn der Browser die Seite in den Hintergrund
   schiebt, speichern wir sofort.
*/

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            if (running) {

                pauseGame();

            } else if (paused) {

                saveGame();
            }
        }
    }
);


/*
   Zusätzlich für Navigation/Tab schließen.
*/

window.addEventListener(
    "pagehide",
    () => {

        if (running) {

            /*
               Nicht auf einen UI-Zustand
               warten – direkt speichern.
            */

            running = false;

            paused = true;

            saveGame();
        }
    }
);


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        startNewGame();
    }
);


resumeButton.addEventListener(
    "click",
    () => {

        resumeGame();
    }
);


newGameButton.addEventListener(
    "click",
    () => {

        startNewGame();
    }
);


restartButton.addEventListener(
    "click",
    () => {

        startNewGame();
    }
);


/* =========================================================
   INITIALER ZUSTAND
========================================================= */

hideAllScreens();


/*
   Gibt es einen gespeicherten Lauf?
*/

const hasSavedGame =
    loadGame();


if (hasSavedGame) {

    /*
       Wir zeigen zunächst den
       Pause-Bildschirm.

       Dadurch kann der Spieler entscheiden,
       ob er fortsetzen möchte.
    */

    paused = true;

    showPauseScreen();

} else {

    /*
       Kein gespeicherter Lauf:
       normaler Startbildschirm.
    */

    startScreen.classList.remove(
        "hidden"
    );
}

</script>

</body>
</html>
