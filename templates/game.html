<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Genga Surfer</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07111f;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  touch-action: none;
}

/* =========================
   3D SPIEL
========================= */

#gameContainer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07111f;

  /* WICHTIG:
     Das 3D-Canvas darf keine
     Menü-Klicks abfangen. */
  pointer-events: none;
}

#gameContainer canvas {
  display: block;
  width: 100%;
  height: 100%;

  pointer-events: none;
}

/* =========================
   HUD
========================= */

#hud {
  position: fixed;
  top: 16px;
  left: 0;
  right: 0;

  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 16px;

  pointer-events: none;
}

.hudLeft {
  display: flex;
  gap: 10px;
}

.hudBox {
  padding: 9px 14px;

  border-radius: 14px;

  background: rgba(5, 15, 30, 0.82);

  border: 1px solid rgba(255,255,255,0.15);

  color: white;

  font-size: 16px;
  font-weight: 800;

  backdrop-filter: blur(12px);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25);
}

.pauseButton {
  pointer-events: auto;

  position: relative;
  z-index: 1000;

  width: 46px;
  height: 46px;

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 14px;

  background: rgba(5,15,30,0.82);

  color: white;

  font-size: 19px;
  font-weight: 900;

  cursor: pointer;

  backdrop-filter: blur(12px);
}

.pauseButton:active {
  transform: scale(0.94);
}

/* =========================
   OVERLAYS
========================= */

.screen {
  position: fixed;
  inset: 0;

  z-index: 500;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    linear-gradient(
      180deg,
      rgba(2,8,18,0.62),
      rgba(2,8,18,0.88)
    );

  backdrop-filter: blur(10px);

  /* WICHTIG:
     Die Menüs dürfen Klicks empfangen. */
  pointer-events: auto;
}

.hidden {
  display: none !important;
}

/* =========================
   MAIN PANEL
========================= */

.panel {
  position: relative;
  z-index: 600;

  width: min(430px, 92vw);

  padding: 34px 25px;

  text-align: center;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(15,34,60,0.97),
      rgba(6,18,34,0.97)
    );

  border: 1px solid rgba(255,255,255,0.13);

  box-shadow:
    0 30px 90px rgba(0,0,0,0.55),
    inset 0 1px rgba(255,255,255,0.08);
}

.panel h1 {
  font-size: clamp(40px, 11vw, 62px);

  line-height: 0.92;

  letter-spacing: -3px;

  margin-bottom: 10px;
}

.panel h2 {
  font-size: 40px;

  letter-spacing: -1px;

  margin-bottom: 25px;
}

.subtitle {
  color: #8ea4bd;

  font-size: 16px;

  margin-bottom: 25px;
}

.menuCoins {
  display: inline-flex;

  align-items: center;
  gap: 7px;

  padding: 10px 17px;

  margin-bottom: 25px;

  border-radius: 50px;

  background: rgba(255,255,255,0.08);

  font-size: 18px;
  font-weight: 800;
}

/* =========================
   BUTTONS
========================= */

.mainButton,
.secondaryButton {
  position: relative;
  z-index: 1000;

  width: 100%;

  padding: 15px 20px;

  margin-top: 11px;

  border-radius: 15px;

  font-size: 16px;

  font-weight: 900;

  cursor: pointer;

  transition:
    transform 0.12s,
    filter 0.12s,
    background 0.12s;

  pointer-events: auto;

  -webkit-user-select: none;
  user-select: none;
}

.mainButton {
  border: 0;

  background: #ffffff;

  color: #07111f;
}

.secondaryButton {
  border: 1px solid rgba(255,255,255,0.13);

  background: rgba(255,255,255,0.08);

  color: white;
}

.mainButton:active,
.secondaryButton:active {
  transform: scale(0.97);
}

.mainButton:hover,
.secondaryButton:hover {
  filter: brightness(1.08);
}

.controlsText {
  margin-top: 25px;

  color: #71869e;

  font-size: 13px;
}

/* =========================
   GAME OVER
========================= */

.resultText {
  margin: 12px 0;

  color: #91a5bc;

  font-size: 15px;
}

.resultText strong {
  display: block;

  margin-top: 3px;

  color: white;

  font-size: 34px;
}

/* =========================
   SHOP
========================= */

.shopPanel {
  position: relative;
  z-index: 600;

  width: min(850px, 94vw);

  max-height: 90vh;

  overflow-y: auto;

  padding: 25px;

  border-radius: 26px;

  background:
    linear-gradient(
      145deg,
      rgba(15,34,60,0.98),
      rgba(6,18,34,0.98)
    );

  border: 1px solid rgba(255,255,255,0.13);

  box-shadow:
    0 30px 90px rgba(0,0,0,0.6);

  pointer-events: auto;
}

.shopHeader {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 25px;
}

.shopHeader h2 {
  font-size: 36px;
}

.shopCoins {
  margin-top: 5px;

  color: #ffd84a;

  font-size: 17px;
  font-weight: 900;
}

.closeButton {
  position: relative;
  z-index: 1000;

  width: 44px;
  height: 44px;

  border: 0;

  border-radius: 13px;

  background: rgba(255,255,255,0.09);

  color: white;

  font-size: 20px;

  cursor: pointer;

  pointer-events: auto;
}

.shopSection {
  margin-top: 20px;
}

.shopSection h3 {
  margin-bottom: 13px;

  font-size: 20px;
}

.shopHint {
  margin-bottom: 15px;

  color: #7f94ab;

  font-size: 13px;
}

.shopGrid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap: 12px;
}

.shopItem,
.upgradeItem {
  padding: 15px;

  border-radius: 17px;

  background: rgba(255,255,255,0.055);

  border: 1px solid rgba(255,255,255,0.09);
}

.skinPreview {
  width: 58px;
  height: 58px;

  margin-bottom: 10px;

  border-radius: 15px;

  border: 3px solid rgba(255,255,255,0.45);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.25);
}

.shopItem h4,
.upgradeItem h4 {
  margin-bottom: 5px;

  font-size: 17px;
}

.shopItem p,
.upgradeItem p {
  min-height: 35px;

  color: #8195ac;

  font-size: 13px;

  line-height: 1.4;
}

.shopItem button,
.upgradeItem button {
  position: relative;
  z-index: 1000;

  width: 100%;

  padding: 10px;

  margin-top: 10px;

  border: 0;

  border-radius: 10px;

  background: white;

  color: #07111f;

  font-weight: 900;

  cursor: pointer;

  pointer-events: auto;
}

.shopItem button:disabled,
.upgradeItem button:disabled {
  opacity: 0.45;

  cursor: default;
}

.upgradeList {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap: 12px;
}

.charge {
  display: block;

  margin-top: 8px;

  color: #d8e5f2;

  font-size: 13px;

  font-weight: 800;
}

.activeUpgrade {
  border-color: rgba(255,255,255,0.4);

  background: rgba(255,255,255,0.10);
}

/* =========================
   POWERUP
========================= */

.powerupInfo {
  position: fixed;

  top: 82px;
  left: 50%;

  z-index: 300;

  transform: translateX(-50%);

  padding: 10px 18px;

  border-radius: 50px;

  background: rgba(4,13,27,0.92);

  border: 1px solid rgba(255,255,255,0.15);

  font-weight: 900;

  pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #hud {
    top: 10px;
    padding: 0 10px;
  }

  .hudBox {
    padding: 8px 11px;
    font-size: 14px;
  }

  .pauseButton {
    width: 44px;
    height: 44px;
  }

  .panel {
    padding: 28px 20px;
  }

  .panel h1 {
    font-size: 44px;
  }

  .shopPanel {
    padding: 18px;
  }

  .shopGrid,
  .upgradeList {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- =========================
     3D SPIEL
========================= -->

<div id="gameContainer"></div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

  <div class="hudLeft">

    <div class="hudBox">
      🪙 <span id="coinCount">0</span>
    </div>

    <div class="hudBox">
      Score: <span id="score">0</span>
    </div>

  </div>

  <button
    id="pauseButton"
    class="pauseButton hidden"
    type="button"
  >
    Ⅱ
  </button>

</div>


<!-- =========================
     START
========================= -->

<div
  id="startScreen"
  class="screen"
>

  <div class="panel">

    <h1>
      GENGA<br>SURFER
    </h1>

    <p class="subtitle">
      Endless Runner
    </p>

    <div class="menuCoins">
      🪙
      <span id="menuCoinCount">0</span>
    </div>

    <button
      id="startButton"
      class="mainButton"
      type="button"
    >
      SPIELEN
    </button>

    <button
      id="resumeButton"
      class="secondaryButton hidden"
      type="button"
    >
      FORTSETZEN
    </button>

    <button
      id="openShopButton"
      class="secondaryButton"
      type="button"
    >
      🛒 SHOP
    </button>

    <p class="controlsText">
      ← → oder Wischen zum Bewegen
    </p>

  </div>

</div>


<!-- =========================
     PAUSE
========================= -->

<div
  id="pauseScreen"
  class="screen hidden"
>

  <div class="panel">

    <h2>PAUSE</h2>

    <button
      id="resumeGameButton"
      class="mainButton"
      type="button"
    >
      WEITERSPIELEN
    </button>

    <button
      id="pauseShopButton"
      class="secondaryButton"
      type="button"
    >
      🛒 SHOP
    </button>

    <button
      id="pauseMenuButton"
      class="secondaryButton"
      type="button"
    >
      HAUPTMENÜ
    </button>

  </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div
  id="gameOverScreen"
  class="screen hidden"
>

  <div class="panel">

    <h2>GAME OVER</h2>

    <div class="resultText">
      Score
      <strong id="finalScore">0</strong>
    </div>

    <div class="resultText">
      Bestwert
      <strong id="bestScore">0</strong>
    </div>

    <button
      id="restartButton"
      class="mainButton"
      type="button"
    >
      NOCHMAL
    </button>

    <button
      id="gameOverShopButton"
      class="secondaryButton"
      type="button"
    >
      🛒 SHOP
    </button>

    <button
      id="gameOverMenuButton"
      class="secondaryButton"
      type="button"
    >
      HAUPTMENÜ
    </button>

  </div>

</div>


<!-- =========================
     SHOP
========================= -->

<div
  id="shopScreen"
  class="screen hidden"
>

  <div class="shopPanel">

    <div class="shopHeader">

      <div>

        <h2>SHOP</h2>

        <div class="shopCoins">
          🪙 <span id="shopCoins">0</span>
        </div>

      </div>

      <button
        id="closeShopButton"
        class="closeButton"
        type="button"
      >
        ✕
      </button>

    </div>


    <div class="shopSection">

      <h3>SKINS</h3>

      <div
        id="skinItems"
        class="shopGrid"
      ></div>

    </div>


    <div class="shopSection">

      <h3>UPGRADES</h3>

      <p class="shopHint">
        Kaufe Upgrades und aktiviere sie
        vor dem nächsten Run.
      </p>

      <div
        id="upgradeItems"
        class="upgradeList"
      ></div>

    </div>

  </div>

</div>


<!-- =========================
     POWERUP
========================= -->

<div
  id="powerupInfo"
  class="powerupInfo hidden"
>

  <span id="powerupText"></span>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="upgrades.js"></script>
<script src="game3d.js"></script>
<script src="controls.js"></script>
<script src="game.js"></script>

</body>
</html>
