<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >

</head>


<body>


    <main id="game">


        <!-- =====================================
             3D SPIEL
        ====================================== -->

        <div id="gameCanvas"></div>



        <!-- =====================================
             GAME HEADER
        ====================================== -->

        <div class="game-header">


            <!-- SCORE -->

            <div class="score">

                Score:

                <span id="score">
                    0
                </span>

            </div>



            <!-- PAUSE BUTTON -->

            <button
                id="pauseButton"
                type="button"
                aria-label="Spiel pausieren"
            >
                ⏸
            </button>


        </div>



        <!-- =====================================
             START SCREEN
        ====================================== -->

        <div
            id="startScreen"
            class="game-screen"
        >

            <h1>
                GENGA SURFER
            </h1>


            <p>
                Run. Dodge. Survive.
            </p>


            <!--
                Dieser Button wird nur angezeigt,
                wenn ein gespeicherter Lauf existiert.
            -->

            <button
                id="continueButton"
                type="button"
                class="hidden"
            >
                Fortsetzen
            </button>


            <!--
                Startet einen komplett neuen Lauf.
            -->

            <button
                id="startButton"
                type="button"
            >
                Neues Spiel
            </button>


        </div>



        <!-- =====================================
             PAUSE SCREEN
        ====================================== -->

        <div
            id="pauseScreen"
            class="game-screen hidden"
        >

            <h1>
                PAUSE
            </h1>


            <p>
                Dein Spiel wurde gespeichert.
            </p>


            <button
                id="resumeButton"
                type="button"
            >
                Fortsetzen
            </button>


        </div>



        <!-- =====================================
             GAME OVER SCREEN
        ====================================== -->

        <div
            id="gameOverScreen"
            class="game-screen hidden"
        >

            <h1>
                GAME OVER
            </h1>


            <p>

                Score:

                <span id="finalScore">
                    0
                </span>

            </p>


            <button
                id="restartButton"
                type="button"
            >
                Neues Spiel
            </button>


        </div>


    </main>



    <!-- =====================================
         THREE.JS
    ====================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ></script>



    <!-- =====================================
         GAME 3D
    ====================================== -->

    <script
        src="{{ url_for('static', filename='js/game3d.js') }}"
    ></script>



    <!-- =====================================
         GAME CONTROLLER
    ====================================== -->

    <script
        src="{{ url_for('static', filename='js/game.js') }}"
    ></script>



    <!-- =====================================
         CONTROLS / SWIPE
    ====================================== -->

    <script
        src="{{ url_for('static', filename='js/controls.js') }}"
    ></script>


</body>

</html>
