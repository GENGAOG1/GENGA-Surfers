<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/game.css') }}"
    >

</head>


<body>

<main id="game">

    <!-- =====================================
         3D SPIEL
    ====================================== -->

    <div id="gameCanvas"></div>


    <!-- =====================================
         HUD
    ====================================== -->

    <div
        id="gameHUD"
        class="game-header hidden"
    >

        <div class="hud-box">

            <span>Score</span>

            <strong id="score">
                0
            </strong>

        </div>


        <div class="hud-box">

            <span>🪙</span>

            <strong id="coins">
                0
            </strong>

        </div>


        <div class="hud-box">

            <span>Best</span>

            <strong id="highscore">
                0
            </strong>

        </div>


        <button
            id="pauseButton"
            type="button"
            aria-label="Spiel pausieren"
        >
            ⏸
        </button>

    </div>



    <!-- =====================================
         HAUPTMENÜ
    ====================================== -->

    <div
        id="mainMenu"
        class="game-screen"
    >

        <h1>
            GENGA SURFER
        </h1>


        <p>
            Run. Dodge. Survive.
        </p>


        <div class="menu-coins">

            🪙

            <span id="menuCoins">
                0
            </span>

        </div>


        <button
            id="playButton"
            type="button"
        >
            ▶ Spielen
        </button>


        <button
            id="shopButton"
            type="button"
        >
            🛒 Shop
        </button>


        <div class="best-score">

            🏆 Bestscore:

            <strong id="menuHighscore">
                0
            </strong>

        </div>

    </div>



    <!-- =====================================
         SHOP
    ====================================== -->

    <div
        id="shopScreen"
        class="game-screen hidden"
    >

        <div class="shop-header">

            <button
                id="backToMenuButton"
                class="back-button"
                type="button"
            >
                ←
            </button>


            <h1>
                SHOP
            </h1>

        </div>


        <div class="shop-coins">

            🪙

            <span id="shopCoins">
                0
            </span>

        </div>


        <div class="shop-items">


            <!-- BLAU -->

            <div
                class="shop-item"
                data-skin="blue"
            >

                <div
                    class="skin-preview blue-preview"
                ></div>


                <h2>
                    Blau
                </h2>


                <p>
                    Kostenlos
                </p>


                <button
                    class="skin-button"
                    data-skin="blue"
                >
                    Auswählen
                </button>

            </div>



            <!-- ROT -->

            <div
                class="shop-item"
                data-skin="red"
            >

                <div
                    class="skin-preview red-preview"
                ></div>


                <h2>
                    Rot
                </h2>


                <p>
                    🪙 50
                </p>


                <button
                    class="skin-button"
                    data-skin="red"
                    data-price="50"
                >
                    Kaufen
                </button>

            </div>



            <!-- LILA -->

            <div
                class="shop-item"
                data-skin="purple"
            >

                <div
                    class="skin-preview purple-preview"
                ></div>


                <h2>
                    Lila
                </h2>


                <p>
                    🪙 100
                </p>


                <button
                    class="skin-button"
                    data-skin="purple"
                    data-price="100"
                >
                    Kaufen
                </button>

            </div>



            <!-- GRÜN -->

            <div
                class="shop-item"
                data-skin="green"
            >

                <div
                    class="skin-preview green-preview"
                ></div>


                <h2>
                    Grün
                </h2>


                <p>
                    🪙 200
                </p>


                <button
                    class="skin-button"
                    data-skin="green"
                    data-price="200"
                >
                    Kaufen
                </button>

            </div>

        </div>

    </div>



    <!-- =====================================
         PAUSE
    ====================================== -->

    <div
        id="pauseScreen"
        class="game-screen hidden"
    >

        <h1>
            PAUSE
        </h1>


        <p>
            Dein Spiel wurde gespeichert.
        </p>


        <button
            id="resumeButton"
            type="button"
        >
            ▶ Fortsetzen
        </button>


        <button
            id="pauseMenuButton"
            type="button"
        >
            🏠 Hauptmenü
        </button>

    </div>



    <!-- =====================================
         GAME OVER
    ====================================== -->

    <div
        id="gameOverScreen"
        class="game-screen hidden"
    >

        <h1>
            GAME OVER
        </h1>


        <p>

            Score:

            <strong id="finalScore">
                0
            </strong>

        </p>


        <p>

            🪙 Münzen:

            <strong id="finalCoins">
                0
            </strong>

        </p>


        <p
            id="newHighscoreText"
            class="new-highscore hidden"
        >
            🏆 NEUER HIGHSCORE!
        </p>


        <button
            id="gameOverMenuButton"
            type="button"
        >
            🏠 Hauptmenü
        </button>


        <button
            id="gameOverRestartButton"
            type="button"
        >
            🔄 Nochmal spielen
        </button>

    </div>

</main>



<!-- =====================================
     THREE.JS
====================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
></script>



<!-- =====================================
     3D GAME
====================================== -->

<script
    src="{{ url_for('static', filename='js/game3d.js') }}"
></script>



<!-- =====================================
     GAME CONTROLLER
====================================== -->

<script
    src="{{ url_for('static', filename='js/game.js') }}"
></script>



<!-- =====================================
     CONTROLS
====================================== -->

<script
    src="{{ url_for('static', filename='js/controls.js') }}"
></script>


</body>
</html>
