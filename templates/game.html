<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- =================================
         3D GAME
    ================================== -->

    <div
        id="gameCanvas"
        class="game-canvas"
    ></div>


    <!-- =================================
         HUD
    ================================== -->

    <div
        id="gameHUD"
        class="game-hud"
    >

        <div
            id="score"
            class="score"
        >
            0
        </div>


        <div
            id="lives"
            class="lives"
        ></div>


        <div
            id="activeUpgradeDisplay"
            class="active-upgrade-display"
        ></div>

    </div>


    <!-- =================================
         START SCREEN
    ================================== -->

    <div
        id="startScreen"
        class="overlay"
    >

        <div class="menu">

            <h1>
                GENGA SURFER
            </h1>


            <div
                class="coin-display"
            >
                🪙 0
            </div>


            <button
                id="startButton"
                class="main-button"
            >
                SPIELEN
            </button>


            <!-- =========================
                 UPGRADE MENU
            ========================== -->

            <div
                id="upgradeMenu"
                class="upgrade-menu"
            >

                <div
                    class="upgrade-header"
                >

                    <h2>
                        UPGRADES
                    </h2>

                    <div
                        id="upgradeCoinDisplay"
                        class="upgrade-coins"
                    >
                        🪙 0
                    </div>

                </div>


                <div
                    id="upgradeMessage"
                    class="upgrade-message"
                ></div>


                <div
                    id="upgradeList"
                    class="upgrade-list"
                ></div>

            </div>

        </div>

    </div>


    <!-- =================================
         GAME OVER
    ================================== -->

    <div
        id="gameOverScreen"
        class="overlay hidden"
    >

        <div class="menu">

            <h1>
                GAME OVER
            </h1>


            <div>
                SCORE:
            </div>


            <div
                id="finalScore"
                class="final-score"
            >
                0
            </div>


            <button
                id="restartButton"
                class="main-button"
            >
                NEU STARTEN
            </button>


            <button
                id="menuButton"
                class="secondary-button"
                onclick="location.reload()"
            >
                HAUPTMENÜ
            </button>

        </div>

    </div>


    <!-- =================================
         THREE.JS
    ================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ></script>


    <!-- =================================
         GAME SCRIPTS
    ================================== -->

    <script
        src="{{ url_for('static', filename='js/upgrades.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/game3d.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/controls.js') }}"
    ></script>


    <script
        src="{{ url_for('static', filename='js/game.js') }}"
    ></script>

</body>

</html>
