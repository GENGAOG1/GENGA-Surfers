<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GENGA Surfer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<main class="game-page">

    <div class="game-header">
        <strong>GENGA SURFER</strong>
        <span>Punkte: <strong id="score">0</strong></span>
    </div>

    <div id="game">
        <canvas id="canvas"></canvas>

        <div id="startScreen" class="screen">
            <h1>GENGA SURFER</h1>
            <p>Wische nach links oder rechts.</p>
            <button id="start">Spielen</button>
        </div>

        <div id="gameOver" class="screen hidden">
            <h1>GAME OVER</h1>
            <p>Punkte: <strong id="finalScore">0</strong></p>
            <button id="restart">Nochmal spielen</button>
        </div>
    </div>

</main>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");

const startButton = document.getElementById("start");
const restartButton = document.getElementById("restart");

const scoreText = document.getElementById("score");
const finalScoreText = document.getElementById("finalScore");


let width;
let height;

let playerLane = 1;

let blocks = [];

let running = false;

let score = 0;

let lastTime = 0;

let spawnTimer = 0;

let speed = 0.00035;


/* =========================
   CANVAS
========================= */

function resize() {

    const rect = canvas.getBoundingClientRect();

    width = rect.width;
    height = rect.height;

    canvas.width = width * devicePixelRatio;
    canvas.height = height * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener("resize", resize);

resize();


/* =========================
   SPUREN
========================= */

function laneX(lane) {

    return width * (
        0.20 +
        lane * 0.30
    );
}


/* =========================
   HINTERGRUND
========================= */

function drawBackground() {

    ctx.fillStyle = "#101820";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Himmel
    */

    ctx.fillStyle = "#263746";

    ctx.fillRect(
        0,
        0,
        width,
        height * 0.35
    );


    /*
       Boden
    */

    ctx.fillStyle = "#202020";

    ctx.beginPath();

    ctx.moveTo(
        width * 0.18,
        height * 0.30
    );

    ctx.lineTo(
        width * 0.82,
        height * 0.30
    );

    ctx.lineTo(
        width,
        height
    );

    ctx.lineTo(
        0,
        height
    );

    ctx.closePath();

    ctx.fill();


    /*
       Drei Spuren
    */

    for (let i = 0; i < 3; i++) {

        ctx.beginPath();

        const x = laneX(i);

        ctx.moveTo(
            x,
            height * 0.30
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.strokeStyle = "#383838";

        ctx.lineWidth = width * 0.20;

        ctx.stroke();
    }
}


/* =========================
   SPIELER
========================= */

function drawPlayer() {

    const x = laneX(playerLane);

    const y = height * 0.82;

    const size = Math.min(
        width * 0.12,
        55
    );


    ctx.fillStyle = "#00d9ff";

    ctx.fillRect(
        x - size / 2,
        y - size,
        size,
        size
    );
}


/* =========================
   BLOCK
========================= */

function drawBlock(block) {

    const x = laneX(block.lane);


    /*
       Perspektive:
       Je näher der Block kommt,
       desto größer wird er.
    */

    const depth = block.depth;

    const size =
        15 +
        depth * 90;


    const y =
        height * 0.30 +
        depth *
        (height * 0.52);


    ctx.fillStyle = block.color;


    /*
       Der Block füllt
       die komplette Spur.
    */

    const laneWidth =
        width * 0.20;


    ctx.fillRect(

        x - laneWidth / 2,

        y - size,

        laneWidth,

        size
    );
}


/* =========================
   BLOCK ERZEUGEN
========================= */

function createBlock() {

    /*
       Nur eine zufällige Spur
    */

    const lane =
        Math.floor(
            Math.random() * 3
        );


    const colors = [

        "#ff3030",
        "#00aaff",
        "#00cc66",
        "#ffcc00",
        "#aa55ff",
        "#ff6600"

    ];


    blocks.push({

        lane: lane,

        depth: 0,

        color:
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ]

    });
}


/* =========================
   KOLLISION
========================= */

function checkCollision(block) {

    if (
        block.lane === playerLane &&
        block.depth > 0.88
    ) {

        endGame();
    }
}


/* =========================
   SPIEL START
========================= */

function startGame() {

    running = true;

    score = 0;

    playerLane = 1;

    blocks = [];

    spawnTimer = 0;

    speed = 0.00035;

    scoreText.textContent = "0";

    startScreen.classList.add("hidden");

    gameOver.classList.add("hidden");

    lastTime = performance.now();

    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    finalScoreText.textContent =
        Math.floor(score);

    gameOver.classList.remove(
        "hidden"
    );
}


/* =========================
   SPIEL
========================= */

function loop(time) {

    if (!running) {
        return;
    }


    const delta =
        time - lastTime;

    lastTime = time;


    /*
       Punkte
    */

    score += delta * 0.01;

    scoreText.textContent =
        Math.floor(score);


    /*
       Geschwindigkeit
    */

    speed +=
        delta * 0.00000001;


    /*
       Neue Blöcke
    */

    spawnTimer += delta;


    if (spawnTimer > 850) {

        spawnTimer = 0;

        createBlock();
    }


    /*
       Blöcke nach vorne bewegen
    */

    blocks.forEach(block => {

        block.depth +=
            speed * delta;

        checkCollision(block);

    });


    /*
       Alte Blöcke entfernen
    */

    blocks = blocks.filter(
        block =>
            block.depth < 1.2
    );


    /*
       Zeichnen
    */

    drawBackground();


    /*
       Entfernte Blöcke zuerst
    */

    blocks
        .sort(
            (a, b) =>
                a.depth - b.depth
        )
        .forEach(drawBlock);


    drawPlayer();


    requestAnimationFrame(loop);
}


/* =========================
   SWIPE
========================= */

let touchStartX = null;


canvas.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.touches[0].clientX;

    },
    { passive: true }
);


canvas.addEventListener(
    "touchend",
    event => {

        if (touchStartX === null) {
            return;
        }


        const touchEndX =
            event.changedTouches[0].clientX;


        const difference =
            touchEndX - touchStartX;


        /*
           Nur deutliche Swipes
        */

        if (Math.abs(difference) > 40) {

            if (difference < 0) {

                /*
                   Nach links
                */

                playerLane =
                    Math.max(
                        0,
                        playerLane - 1
                    );

            } else {

                /*
                   Nach rechts
                */

                playerLane =
                    Math.min(
                        2,
                        playerLane + 1
                    );
            }
        }


        touchStartX = null;
    },
    { passive: true }
);


/* =========================
   BUTTONS
========================= */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);

</script>

</body>
</html>
